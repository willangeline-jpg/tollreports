name: Auto-Generate Toll Reports

on:
  push:
    paths:
      - '*.xlsx'
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install openpyxl matplotlib pandas numpy
      
      - name: Generate reports
        run: python generate_toll_reports.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-generate toll reports" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
