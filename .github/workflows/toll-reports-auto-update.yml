name: Auto-Generate Toll Reports

on:
  push:
    paths:
      - '*.xlsx'
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'  # 1st of month at 8 AM UTC

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install openpyxl matplotlib pandas numpy
      
      - name: Generate reports
        run: python generate_toll_reports.py
      
      - name: Check if files were created
        run: |
          ls -la reports/ 2>/dev/null || echo "Reports folder not
